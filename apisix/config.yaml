#
# Apache APISIX configuration for Railway.
#
# Every value that differs per deployment is read from an environment variable
# with APISIX's own `${{VAR}}` interpolation, so this file is committed and the
# secrets are not. A variable with no `:=` default is mandatory: APISIX refuses
# to start with "can't find environment variable", which fails closed.
#
apisix:
  node_listen:
    - 9080                       # data plane; the public domain targets this port

  enable_admin: true
  enable_control: true

  # Railway's private network is IPv6-first. Leave this on unless a probe shows
  # the environment's A records are the reachable half.
  enable_ipv6: ${{APISIX_ENABLE_IPV6:=true}}

  # Control API stays on loopback: it is an unauthenticated debug surface.
  control:
    ip: 127.0.0.1
    port: 9092

  # /status and /status/ready. Railway's health-check prober reaches this from
  # 100.64.0.2 over IPv4, so it has to bind the wildcard rather than loopback.
  status:
    ip: 0.0.0.0
    port: 7085

  # Railway's edge proxies from CGNAT space and overwrites X-Forwarded-For and
  # X-Real-IP itself, so trusting it is safe and is what preserves
  # X-Forwarded-Proto: https for upstreams.
  trusted_addresses:
    - 100.64.0.0/10
    - fd00::/8

  # TLS is terminated at Railway's edge, so APISIX's own 9443 listener is
  # unreachable. Set APISIX_ENABLE_SSL=true if you terminate TLS in APISIX.
  ssl:
    enable: ${{APISIX_ENABLE_SSL:=false}}

  # Encrypts SSL private keys and plugin secret fields at rest in etcd. Must be
  # exactly 16 or 32 characters and must never change once data is written.
  data_encryption:
    enable_encrypt_fields: true
    keyring:
      - "${{APISIX_KEYRING}}"

nginx_config:
  # `auto` reads the host's 48 cores, not the container's CPU quota.
  worker_processes: ${{APISIX_WORKER_PROCESSES:=2}}
  http:
    real_ip_header: X-Real-IP
    real_ip_recursive: "off"
    real_ip_from:
      - 127.0.0.1
      - "unix:"
      - 100.64.0.0/10
      - fd00::/8

deployment:
  role: traditional
  role_traditional:
    config_provider: etcd

  admin:
    admin_key_required: true
    admin_key:
      - name: admin
        key: "${{APISIX_ADMIN_KEY}}"
        role: admin
    # The dashboard is same-origin behind the admin proxy, so no CORS header is
    # needed. Set APISIX_ADMIN_CORS=true to call the Admin API from a browser
    # app on another origin.
    enable_admin_cors: ${{APISIX_ADMIN_CORS:=false}}
    enable_admin_ui: true
    # The default is 127.0.0.0/24, which 403s the admin proxy. Railway gives every
    # container a ULA address out of fd00::/8 and private networking is scoped to
    # one project and environment, so this admits this project's own services and
    # nothing else. The admin key is still what authenticates every request.
    allow_admin:
      - 127.0.0.0/24
      - "fd00::/8"
    # `[::]` and not `0.0.0.0`: APISIX renders this as a single nginx `listen`
    # directive with no IPv6 twin (unlike node_listen, which it duplicates when
    # enable_ipv6 is set), and Railway's private network routes IPv6 between
    # services. On 0.0.0.0 the admin proxy cannot reach this port at all.
    # Nothing on IPv4 needs it: the health-check prober uses the status port.
    # The brackets are required - APISIX joins this with `ip .. ":" .. port`,
    # so a bare `::` renders the invalid `listen :::9180`.
    admin_listen:
      ip: "[::]"
      port: 9180
    admin_api_version: v3

  etcd:
    host:
      - "${{APISIX_ETCD_URL:=http://etcd.railway.internal:2379}}"
    prefix: /apisix
    timeout: 30
    startup_retry: 5
    user: "${{APISIX_ETCD_USER:=root}}"
    password: "${{APISIX_ETCD_PASSWORD}}"
